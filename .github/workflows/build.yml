name: Build D mod

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: latest
      - name: Upload the mod
        uses: actions/upload-artifact@v4
        with:
          name: d-mod
          path: output/*.geode
